# 모니터링 EC2 전용. Prometheus·Loki·Grafana.
# 사용(모니터링 EC2, 이 폴더에서):
#   docker compose --env-file .env up -d
name: dongnemarket-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: dongne-prometheus
    restart: unless-stopped
    expose:
      - "9090"                         # grafana만 내부에서 접근 (외부 노출 X)
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  loki:
    image: grafana/loki:3.1.1
    container_name: dongne-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"                    # 앱 EC2 promtail이 push (SG로 앱 SG만 허용)
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:11.1.4
    container_name: dongne-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"                    # 팀 접속 (SG 0.0.0.0/0)
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
