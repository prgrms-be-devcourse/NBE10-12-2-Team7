# RDB EC2 (DB) 전용. MySQL 8을 컨테이너로 기동.
# 관리형 RDS 대신 EC2에 직접 올리는 구성(현재 인프라 실측 기준).
# 사용(RDB EC2, 이 폴더에서):
#   docker compose --env-file .env up -d
name: dongnemarket-db

services:
  mysql:
    image: mysql:8.0
    container_name: dongne-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"                    # 같은 VPC의 앱 EC2만 SG로 허용(퍼블릭 IP 없음)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dongne_market
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dongne-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dongne-mysql-data:
