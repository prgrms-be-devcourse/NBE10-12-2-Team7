# 앱 EC2에서 실행. 로컬 컨테이너 로그를 모니터링 EC2의 Loki로 push.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.0.0.130:3100/loki/api/v1/push   # 모니터링 EC2 Loki (프라이빗 IP)

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/dongne-(.*)'
        target_label: 'service'
