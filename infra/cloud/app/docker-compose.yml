# EC2 #1 (app) 전용. mysql 없음 → 외부 DB(RDB EC2). 이미지는 ECR pull.
# 사용(EC2 #1, 이 폴더에서):
#   docker compose --env-file .env pull
#   docker compose --env-file .env up -d
name: dongnemarket-app

services:
  app:
    image: ${ECR_REGISTRY}/dongnemarket-app:${IMAGE_TAG:-latest}
    container_name: dongne-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local          # prometheus 노출(모니터 EC2가 scrape)
      DB_URL: ${DB_URL}                       # ← RDB EC2 프라이빗 IP (.env)
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}     # AWS에서 접근 가능한 주소여야 함
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      # 이메일 인증/비번 재설정 메일 발송(팀 기능). 계정정보는 .env에서만 관리
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    volumes:
      - dongne-report-evidence:/app/uploads/report-evidence   # 신고 증빙 이미지: 재시작에도 유지
    ports:
      - "8080:8080"                           # 호스트 발행(모니터 EC2 Prometheus scrape). SG로 monitoring-sg만 허용

  next:
    image: ${ECR_REGISTRY}/dongnemarket-next:${IMAGE_TAG:-latest}
    container_name: dongne-next
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: dongne-nginx
    restart: unless-stopped
    depends_on:
      - app
      - next
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # ← 같은 폴더의 cloud용 conf

  # 로그 수집 → 모니터링 EC2의 Loki로 push
  promtail:
    image: grafana/promtail:3.1.1
    container_name: dongne-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  dongne-report-evidence:
