global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'dongnemarket-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']          # 같은 compose 네트워크의 앱 컨테이너
        labels:
          application: 'dongnemarket'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']