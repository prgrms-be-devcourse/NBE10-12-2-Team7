name: dongnemarket

# dev(매일 개발) 전용 — MySQL만 컨테이너로 띄우고 앱·프론트는 호스트에서 직접 실행한다.
#   docker compose up -d --wait          # MySQL만
#   (cd backend && ./gradlew bootRun)    # 백엔드 :8080 (프로파일 미지정 → dev)
#   (cd frontend && npm run dev)         # 프론트 :3000
#
# 전체 컨테이너 배포(nginx+next+app+mysql)는 지형별로 분리돼 있다:
#   온프레미스 → infra/onprem/     (로컬 전체 스택, 이미지 로컬 빌드)
#   클라우드   → infra/cloud/      (EC2 3대, ECR pull)
# 경계 설계: docs/adr/0004-infra-boundary.md · docs/architecture/07-infra-inventory.md
services:
  mysql:
    image: mysql:8.0
    container_name: dongne-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: dongne_market
      MYSQL_USER: ${DB_USERNAME:-dongne}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dongne1234}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dongne-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root1234}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dongne-mysql-data:
