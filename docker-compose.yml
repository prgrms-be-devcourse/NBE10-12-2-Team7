name: dongnemarket

# 로컬 실행 모드:
#   dev          : docker compose up -d --wait                     (mysql만, 앱·프론트는 호스트)
#   local-deploy : docker compose --profile web up -d --build      (nginx+next+app+mysql)  ← 1단계
#   +관측(2단계) : docker compose --profile web --profile observability up -d --build
#   +외부노출(3): docker compose --profile web --profile edge up -d           (Cloudflare 퀵터널)
services:
  mysql:
    image: mysql:8.0
    container_name: dongne-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: dongne_market
      MYSQL_USER: ${DB_USERNAME:-dongne}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dongne1234}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dongne-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root1234}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── profile "web": 로컬 배포 앱 계층 ──────────────────────
  app:
    profiles: ["web"]
    build:
      context: ./backend            # ← 루트 기준 경로
      dockerfile: Dockerfile
    image: dongnemarket-app:latest
    container_name: dongne-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/dongne_market?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-dongne}
      DB_PASSWORD: ${DB_PASSWORD:-dongne1234}
      JWT_SECRET: ${JWT_SECRET:-dongne-market-local-dev-secret-please-change-0123456789}
      # 이메일 인증/비밀번호 재설정 메일 발송. HOST/PORT는 Gmail 기본값, 계정 정보는 기본값 없이 서버 .env에서만 관리.
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # 신고 증빙/상품 이미지 저장소. 로컬/온프레미스 배포 기본값은 local(볼륨 마운트).
      # S3로 쓰려면 .env에서 FILE_STORAGE_TYPE=s3 + AWS_S3_BUCKET/AWS_REGION + AWS 자격증명(~/.aws 마운트 등)을 직접 준비해야 한다.
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-local}
      FILE_STORAGE_LOCAL_BASE_PATH: /app/uploads
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    volumes:
      - dongne-uploads:/app/uploads   # local 모드일 때만 실제로 쓰인다(신고 증빙 + 상품 이미지 공용)
    expose:
      - "8080"                        # 외부 노출 대신 nginx 통해서만 접근(디버깅 필요하면 ports로 바꿔도 됨)

  next:
    profiles: ["web"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dongnemarket-next:latest
    container_name: dongne-next
    environment:
      NODE_ENV: production
    expose:
      - "3000"                        # nginx 뒤에만

  nginx:
    profiles: ["web"]
    image: nginx:1.27-alpine
    container_name: dongne-nginx
    depends_on:
      - app
      - next
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ── profile "observability": 2단계에서 loki/promtail 추가 예정 ──
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.53.2
    container_name: dongne-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.1.4
    container_name: dongne-grafana
    ports:
      - "3001:3000"                   # ← 3000은 next dev와 충돌하니 호스트는 3001로
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
  loki:
    profiles: [ "observability" ]
    image: grafana/loki:3.1.1
    container_name: dongne-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  promtail:
    profiles: [ "observability" ]
    image: grafana/promtail:3.1.1
    container_name: dongne-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # ── profile "edge": Cloudflare Quick Tunnel (도메인·토큰 없이 임시 외부 URL) ──
  cloudflared:
    profiles: ["edge"]
    image: cloudflare/cloudflared:latest
    container_name: dongne-cloudflared
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  dongne-mysql-data:
  dongne-uploads:
  prometheus-data:
  grafana-data:
  loki-data: