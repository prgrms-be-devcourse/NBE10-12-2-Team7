# 테스트 전용: H2 in-memory (MySQL 미기동 상태에서도 build/test green)
spring:
  datasource:
    url: jdbc:h2:mem:dongne_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false
