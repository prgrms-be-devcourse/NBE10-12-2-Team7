# 테스트 전용: H2 in-memory (MySQL 미기동 상태에서도 build/test green)
spring:
  datasource:
    url: jdbc:h2:mem:dongne_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

  # 테스트는 EmailSender를 @MockitoBean으로 대체해 실제 발송을 하지 않으므로 값이 없어도 무방하다.
  # 값이 아예 없으면 JavaMailSender 빈 생성 시 플레이스홀더 해석 실패로 컨텍스트 로딩 자체가 깨지므로 빈 값으로 고정한다.
  mail:
    username:
    password:

report:
  evidence-image:
    storage-path: build/test-evidence-images
