# 통합테스트 전용: Testcontainers MySQL 8 (@ServiceConnection 이 datasource 자동 주입)
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: never
  # 통합테스트도 EmailSender를 @MockitoBean으로 대체하므로 값 없이 빈 문자열로 고정해 컨텍스트 로딩을 보장한다.
  mail:
    username:
    password:

logging:
  level:
    org.hibernate.SQL: debug

# 저장소 경로를 build/ 아래로 둬서 테스트가 프로젝트 루트를 더럽히지 않게 하고, clean 시 자동으로 지워지게 한다.
report:
  evidence-image:
    storage-path: build/test-evidence-images