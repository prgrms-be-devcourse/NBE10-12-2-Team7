spring:
  application:
    name: dongnemarket

  # 실행 프로파일 미지정(호스트 bootRun) 시 자동 dev. 도커·테스트는 프로파일 명시라 영향 없음.
  profiles:
    default: dev

  # repo root의 .env(gitignore, KEY=VALUE)를 프로퍼티 소스로 읽는다. JVM 작업 디렉터리가
  # backend/(./gradlew bootRun 기본값)인지 repo root(IntelliJ 실행 설정에 따라 다름)인지 확정할 수 없어
  # 두 경로를 모두 optional로 시도한다 — 둘 다 없어도(도커 컨테이너 등 실제 OS 환경변수 주입) 실패하지 않는다.
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:.env[.properties]"

  # DB 접속정보는 환경변수 주입. 기본값(fallback)은 로컬 MySQL = dev 편의.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dongne_market?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:dongne}
    password: ${DB_PASSWORD:dongne1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # DB 마이그레이션(Flyway). 기본 OFF — dev/test는 ddl-auto가 스키마를 담당한다.
  # prod에서만 켜고(+ ddl-auto: validate) db/migration/V*.sql로 스키마를 버전 관리한다. (ADR 0004 P4)
  flyway:
    enabled: false
    baseline-on-migrate: true   # 기존 스키마가 있는 DB(운영)는 V1을 baseline으로 간주하고 V2부터 적용,
    baseline-version: 1         # 빈 DB(신규 온프레미스)는 V1부터 실행해 스키마를 만든다.

  jpa:
    open-in-view: false          # dialect는 자동감지(명시 시 deprecation 경고), ddl/format은 프로파일로

  # 인증 관련 TTL 데이터 저장소(Refresh Token/로그인 실패 카운트/이메일 인증 코드/비밀번호 재설정 토큰).
  # dev/prod에서만 쓰인다 — test 프로파일은 RedisAutoConfiguration 자체가 제외돼 이 값을 안 읽는다.
  # timeout(커맨드 타임아웃)을 짧게 잡아, Redis 장애 시 요청이 Lettuce 기본값(1분)만큼 붙잡히지 않고 빠르게 실패하게 한다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_COMMAND_TIMEOUT:2000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2000ms}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # Spring AI - 사내 Ollama (관리자 AI 어시스턴트)
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://10.111.111.90:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3:14b}
          temperature: 0.1

  # 이메일 인증 / 비밀번호 재설정 메일 발송 (SMTP). 자격증명은 기본값 없이 환경변수로만 주입.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:dongne-market-local-dev-secret-key-please-change-in-production-0123456789}
  access-token-validity-seconds: ${JWT_ACCESS_TTL:900}
  refresh-token-validity-seconds: ${JWT_REFRESH_TTL:604800}

# Refresh Token 쿠키. HTTPS 적용 전까지는 false 유지 — true인데 HTTP면 브라우저가 쿠키를 저장하지 않는다.
auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
  # 비밀번호 재설정 메일 링크가 가리키는 프론트엔드 주소(고정 페이지). 배포 환경에서는 실제 도메인으로 덮어쓴다.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

# 파일 저장소(global/storage). type=local(기본값, 온프레미스/로컬 디스크) 또는 type=s3(AWS S3) 중 선택 —
# 프로파일이 아니라 이 값 하나로 구현체가 갈린다(LocalFileStorageService/S3FileStorageService).
# S3 자격증명은 AWS SDK 기본 체인(로컬 ~/.aws 또는 EC2 IAM 역할) 사용, 코드/설정에 직접 넣지 않는다.
file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    local:
      base-path: ${FILE_STORAGE_LOCAL_BASE_PATH:./uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}

# 일반 API 요청 속도 제한(슬라이딩 윈도우, Redis 기반). 로그인 시도 제한(auth.LoginAttemptService, 고정 윈도우)과는
# 별개로 모든 /api/** 요청에 적용되는 범용 남용 방지 장치다. window-seconds 동안 capacity회 초과 시 429.
rate-limit:
  capacity: ${RATE_LIMIT_CAPACITY:60}
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:10}

# Swagger / Springdoc
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# 기본은 최소 노출(health,info). prometheus는 dev/prod에서만 연다.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  metrics:
    tags:
      application: ${spring.application.name}