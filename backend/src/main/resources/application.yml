spring:
  application:
    name: dongnemarket

  # 실행 프로파일 미지정(호스트 bootRun) 시 자동 dev. 도커·테스트는 프로파일 명시라 영향 없음.
  profiles:
    default: dev

  # 호스트에서 ./gradlew bootRun(작업 디렉터리 = backend/)으로 실행할 때 repo root의 .env(gitignore, KEY=VALUE)를
  # 프로퍼티 소스로 읽는다. 파일이 없어도(도커 컨테이너 등 실제 OS 환경변수로 주입되는 경우) optional이라 실패하지 않는다.
  config:
    import: "optional:file:../.env[.properties]"

  # DB 접속정보는 환경변수 주입. 기본값(fallback)은 로컬 MySQL = dev 편의.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dongne_market?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:dongne}
    password: ${DB_PASSWORD:dongne1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false          # dialect는 자동감지(명시 시 deprecation 경고), ddl/format은 프로파일로

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # Spring AI - 사내 Ollama (관리자 AI 어시스턴트)
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://10.111.111.90:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3:14b}
          temperature: 0.1

  # 이메일 인증 / 비밀번호 재설정 메일 발송 (SMTP). 자격증명은 기본값 없이 환경변수로만 주입.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:dongne-market-local-dev-secret-key-please-change-in-production-0123456789}
  access-token-validity-seconds: ${JWT_ACCESS_TTL:900}
  refresh-token-validity-seconds: ${JWT_REFRESH_TTL:604800}

# Refresh Token 쿠키. HTTPS 적용 전까지는 false 유지 — true인데 HTTP면 브라우저가 쿠키를 저장하지 않는다.
auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}

# 신고 증빙 이미지 로컬 디스크 저장 경로 (report 도메인). local(도커) 프로파일에서는 볼륨 마운트 경로로 덮어쓴다.
report:
  evidence-image:
    storage-path: ${REPORT_EVIDENCE_IMAGE_PATH:./uploads/report-evidence}

# Swagger / Springdoc
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# 기본은 최소 노출(health,info). prometheus는 dev/local에서만 연다.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  metrics:
    tags:
      application: ${spring.application.name}