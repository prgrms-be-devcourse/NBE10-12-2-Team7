# prod: 운영 수위 프로파일. 온프레미스(로컬 전체 컨테이너) 배포와 클라우드(EC2) 배포가 공유한다.
#   두 배포 지형의 차이는 이 프로파일이 아니라 env 바인딩(FILE_STORAGE_TYPE·DB_URL·이미지 출처)으로만 가른다.
#   설계·경계: docs/adr/0004-infra-boundary.md
# 로그는 운영 유사(quiet)하되 prometheus 노출(로컬 관측 스택 / 클라우드 모니터링 EC2가 scrape).
spring:
  jpa:
    hibernate:
      ddl-auto: update   # ⚠️ P4에서 Flyway 도입 후 validate로 전환 예정 (ADR 0003·0004). 그 전까지는 update 유지.
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: info
    org.hibernate.SQL: warn
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
