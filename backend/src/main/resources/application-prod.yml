# prod 프로파일 전용 오버라이드 (실행: SPRING_PROFILES_ACTIVE=prod)
spring:
  datasource:
    # 기본값(fallback) 없음 → 환경변수 미주입 시 기동 실패 = 안전
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate        # P1: 운영 스키마 자동변경 금지
    properties:
      hibernate:
        format_sql: false       # P3: 로그 폭증 방지

jwt:
  secret: ${JWT_SECRET}         # P2: 기본값 제거, 환경변수 필수

logging:
  level:
    root: info
    org.hibernate.SQL: warn     # P3: SQL 디버그 로그 off

# P5: 헬스체크만 최소 노출
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true