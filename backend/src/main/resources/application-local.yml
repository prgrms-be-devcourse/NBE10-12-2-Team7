# local: 전부 Docker(로컬 배포형). DB_URL은 compose가 주입. 로그는 운영 유사(quiet)하되 prometheus 노출.
spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

# 컨테이너 재시작에도 유지되도록 docker-compose.yml의 볼륨 마운트 경로와 일치시킨다.
report:
  evidence-image:
    storage-path: /app/uploads/report-evidence
logging:
  level:
    root: info
    org.hibernate.SQL: warn
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus