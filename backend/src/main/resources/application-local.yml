# local: 전부 Docker(로컬 배포형). DB_URL은 compose가 주입. 로그는 운영 유사(quiet)하되 prometheus 노출.
spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
logging:
  level:
    root: info
    org.hibernate.SQL: warn
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus