# dev: 호스트 bootRun. 로컬 MySQL(base fallback), 개발 편의(스키마 자동반영·SQL 로그).
spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  # dev: 관리자 AI는 로컬 Ollama로 (사내 IP 대신)
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3:4b}

logging:
  level:
    org.hibernate.SQL: debug
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
