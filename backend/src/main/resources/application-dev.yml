# dev: 호스트 bootRun. 로컬 MySQL(base fallback), 개발 편의(스키마 자동반영·SQL 로그).
spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  # dev: 관리자 AI는 로컬 Ollama로 (사내 IP 대신).
  # 로컬은 CPU 추론이라 느리다 → base(qwen3:14b)보다 가벼운 qwen3:1.7b를 기본값으로.
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3:1.7b}

  # 로컬 CPU 추론이 느려(수십 초~분) 기본 read-timeout을 넘겨 AI 호출이 끊기는 것을 방지.
  # non-stream 호출(ChatClient.call())이 쓰는 RestClient가 이 값을 따른다(Spring Boot 3.4+).
  http:
    client:
      read-timeout: 600s
      connect-timeout: 10s

logging:
  level:
    org.hibernate.SQL: debug
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
