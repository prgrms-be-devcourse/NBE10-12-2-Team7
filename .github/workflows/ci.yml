name: CI

# PR 테스트 게이트. 배포는 하지 않는다(그건 cd-*.yml 담당).
# - feature 브랜치 push        → 솔로 작업 중에도 바로 피드백
# - develop 대상 PR            → 머지 전 최종 게이트
# - develop push는 제외        → 거기선 CD가 담당
on:
  push:
    branches-ignore:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

# 같은 ref의 이전 실행은 취소(불필요한 러너 낭비 방지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 백엔드: 단위/슬라이스 테스트 (H2) ──
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests (unit/slice · H2)
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  # ── 프론트: lint + build (타입/빌드 에러 조기 검출) ──
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
