name: CD - Build & Push (app)

# develop에 머지되면 변경된 앱 이미지를 빌드해 ECR로 push.
# (EC2 배포는 이후 단계에서 이 파일에 job을 덧붙인다. 지금은 push까지만.)
on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/cd-app.yml'
  workflow_dispatch:        # 수동 실행 허용(둘 다 강제 빌드)

# OIDC로 AWS 로그인하려면 id-token 쓰기 권한이 필수
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  # ── 어떤 앱이 바뀌었는지 감지 (바뀐 것만 빌드해 낭비 방지) ──
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ── 백엔드 이미지 빌드 → ECR push ──
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/dongnemarket-app:latest
            ${{ steps.ecr.outputs.registry }}/dongnemarket-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 프론트 이미지 빌드 → ECR push ──
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/dongnemarket-next:latest
            ${{ steps.ecr.outputs.registry }}/dongnemarket-next:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 앱 EC2에 SSH로 배포 (pull → up) ──
  deploy:
    needs: [ build-backend, build-frontend ]
    # 빌드 중 하나라도 성공하면(=새 이미지 있으면) 배포
    if: always() && (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to app EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_APP_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin 773505972890.dkr.ecr.ap-northeast-2.amazonaws.com
            docker compose --env-file .env pull
            docker compose --env-file .env up -d
            docker image prune -f