server {
    listen 80;
    server_name _;

    # Docker 내장 DNS. 변수 proxy_pass와 함께 쓰면 nginx가 요청마다 upstream 이름을
    # 재해석해 컨테이너 재생성(IP 변경) 시에도 502가 나지 않음.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API → Spring (경로 /api/** 그대로 전달)
    location /api/ {
        set $upstream_app app;
        proxy_pass http://$upstream_app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 외 전부 → Next
    location / {
        set $upstream_next next;
        proxy_pass http://$upstream_next:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
