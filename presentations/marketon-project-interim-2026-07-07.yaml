      안녕하세요. 지역 기반 중고거래 서비스 '마켓온'의 1차 발표를 맡은 [[확인 필요: 발표자]]입니다.
      오늘은 왜 이 서비스를 만들었는지, 어떤 기능과 구조로 구현했는지, 그리고 앞으로의 계획까지 말씀드리겠습니다.

  # 2. 팀 & 역할
  - layout: bullets
    title: 팀 소개 — 역할 분담
    bullets:
      - "[[확인 필요: 팀원1 — 백엔드]]"
      - "[[확인 필요: 팀원2 — 프론트]]"
      - "[[확인 필요: 팀원3 — 인프라]]"
      - "AI Native 협업 · 병렬 개발"
    notes: |
      저희 팀은 백엔드, 프론트엔드, 인프라로 역할을 나눠 병렬로 개발했습니다.
      단순 분업이 아니라 AI를 적극 활용한 협업 방식으로 속도를 냈고, 이 부분은 뒤 프로세스 슬라이드에서 다시 말씀드리겠습니다.

  # 3. 문제 정의·배경
  - layout: split
    title: 왜 만들었나 — 동네 거래의 신뢰 문제
    bullets:
      - 낯선 사람과의 거래 불안
      - 허위 매물과 노쇼
      - 동네 단위 탐색의 부재
    image: null
    caption: "문제 상황 일러스트 자리 (Canva에서 교체)"
    notes: |
      기존 중고거래는 편리하지만 신뢰 문제가 큽니다. 낯선 사람과 만나는 불안, 허위 매물과 노쇼, 그리고 내 동네 중심으로 물건을 찾기 어렵다는 점입니다.
      마켓온은 '지역'을 축으로 이 세 가지 불편을 줄이는 데서 출발했습니다.

  # 4. 서비스 개요·타깃
  - layout: bullets
    title: 마켓온은 동네 기반 중고거래 플랫폼입니다
    bullets:
      - 내 동네 중심 상품 탐색
      - 채팅·찜·댓글로 이웃과 거래
      - 신고·관리자 운영으로 신뢰 확보
      - 타깃 — 동네 생활권 거래 사용자
    notes: |
      한 문장으로, 마켓온은 '내 동네에서 안심하고 거래하는' 중고거래 플랫폼입니다.
      상품 탐색부터 채팅·찜·댓글 같은 상호작용, 그리고 신고와 관리자 운영까지 신뢰를 만드는 장치를 갖췄습니다. 주 사용자는 동네 생활권에서 거래하려는 분들입니다.

  # 5. 핵심 기능 (MVP 범위)
  - layout: bullets
    title: 핵심 기능 — MVP 범위
    bullets:
      - 회원·인증 (JWT, 이메일 인증, 비밀번호 재설정)
      - 상품 등록·조회 (커서 페이지네이션)
      - 찜 · 댓글 · 채팅
      - 신고 (증빙 이미지, 동시성 처리)
      - 알림 · 관리자 대시보드 (AI 어시스턴트)
    notes: |
      1차까지 구현한 핵심 기능입니다. 회원·인증은 JWT 기반에 이메일 인증과 비밀번호 재설정까지 포함합니다.
      상품은 커서 페이지네이션으로 조회하고, 찜·댓글·채팅으로 상호작용합니다. 신고와 알림, 그리고 AI 어시스턴트가 붙은 관리자 대시보드까지 갖췄습니다.

  # 6. 주요 화면 / 데모
  - layout: visual
    title: 주요 화면
    image: null
    caption: "상품 목록·상세·채팅 스크린샷 자리 (frontend 캡처로 교체)"
    notes: |
      실제 화면입니다. 상품 목록과 상세, 그리고 채팅 흐름을 보여드리겠습니다.
      (데모 시연 또는 스크린샷) 사용자가 동네 상품을 탐색하고 찜하고 채팅으로 이어지는 핵심 플로우를 확인하실 수 있습니다.

  # 7. 시스템 아키텍처
  - layout: split
    title: 아키텍처 — 단일 진입점 + 도메인 분리
    bullets:
      - nginx 단일 현관, /api 프록시
      - Spring Boot(Java 21) · MySQL 8
      - Next.js 16 프론트 (App Router)
      - 관측 · Cloudflare 터널 분리
    image: null
    caption: "C4 컨테이너 다이어그램 자리 (docs/architecture/02)"
    notes: |
      구조는 단순합니다. 브라우저는 nginx라는 단일 현관만 보고, API는 서버가 프록시합니다. 그래서 CORS 설정이 필요 없습니다.
      백엔드는 Java 21 Spring Boot와 MySQL, 프론트는 Next.js 16입니다. 관측 스택과 외부 노출용 터널은 프로파일로 분리해 필요할 때만 띄웁니다.

  # 8. 기술 스택 & 선택 이유
  - layout: bullets
    title: 기술 스택 — 왜 이렇게 골랐나
    bullets:
      - JWT 무상태 인증 → 수평 확장 용이
      - 단일 origin 프록시 → CORS 제거
      - 도메인별 패키지 분리 → 응집도
      - Spring AI + Ollama → 사내 AI 운영
    notes: |
      스택 나열보다 이유를 말씀드립니다. 인증은 JWT 무상태로 서버 세션 없이 확장하기 쉽게 했고, 단일 origin 프록시로 CORS 문제를 아예 없앴습니다.
      백엔드는 도메인별로 패키지를 나눠 응집도를 높였고, 관리자 AI는 사내 Ollama에 Spring AI를 연동해 외부 의존 없이 운영합니다.

  # 9. 데이터 모델 (ERD)
  - layout: visual
    title: 데이터 모델 — 핵심 엔티티
    image: null
    caption: "핵심 엔티티 ERD 자리 (docs/architecture/04) — 회원·상품·거래 중심"
    notes: |
      데이터 모델은 회원, 상품, 그리고 찜·댓글·채팅·신고 같은 상호작용 엔티티를 중심으로 구성했습니다.
      상세 ERD는 문서에 있으며, 여기서는 핵심 관계만 짚고 넘어가겠습니다.

  # 10. 기술적 도전 & 해결
  - layout: split
    title: 기술적 도전 — 동시성과 정합성
    bullets:
      - 신고 중복·동시 요청 → 정합성 위협
      - 락으로 신고 동시성 제어
      - 찜 수 → 이벤트 기반 비동기 반영
      - 통합 테스트로 검증
    image: null
    caption: "동시성 처리 흐름 다이어그램 자리"
    notes: |
      가장 신경 쓴 부분은 동시성입니다. 같은 대상에 신고가 동시에 몰리면 카운트가 어긋날 수 있어, 락으로 정합성을 지켰습니다.
      찜 수는 매 요청마다 갱신하면 부담이라 이벤트 기반으로 비동기 반영했고, 두 경우 모두 통합 테스트로 실제 동작을 검증했습니다.

  # 11. 협업 · 개발 프로세스
  - layout: bullets
    title: 협업 — AI Native 개발 프로세스
    bullets:
      - AI 활용 병렬 개발 (BE·FE·Infra)
      - GitHub PR 리뷰 기반 통합
      - GitHub Actions CI/CD → EC2 자동배포
      - Docker Compose로 환경 일원화
    notes: |
      개발 방식도 저희 프로젝트의 특징입니다. AI를 적극 활용해 세 파트가 병렬로 개발하고, 모든 변경은 PR 리뷰로 통합했습니다.
      GitHub Actions로 빌드부터 EC2 배포까지 자동화했고, 로컬·운영 환경은 Docker Compose로 통일했습니다.

  # 12. 진행 현황 · 남은 작업
  - layout: bullets
    title: 진행 현황 — 1차 시점
    bullets:
      - 완료 — 인증·상품·찜·댓글·신고·알림·관리자
      - 진행 중 — 채팅 고도화
      - "남은 작업 — [[확인 필요: 미완 기능]]"
      - 배포 · 관측 파이프라인 구축 완료
    notes: |
      1차 시점 기준으로 인증부터 관리자까지 핵심 도메인은 대부분 구현을 마쳤습니다. 배포와 관측 파이프라인도 이미 돌아갑니다.
      현재는 채팅을 고도화하는 중이고, 남은 작업은 [[확인 필요]] 부분을 팀과 확정해 채우겠습니다.

  # 13. 향후 계획
  - layout: bullets
    title: 향후 계획 — 최종 발표까지
    bullets:
      - 검색·필터 고도화
      - 실시간 채팅 · 알림 강화
      - 성능 · 부하 테스트
      - "[[확인 필요: 팀 우선순위 반영]]"
    notes: |
      최종 발표까지는 검색과 필터를 고도화하고, 채팅과 알림을 실시간성 중심으로 강화할 계획입니다.
      배포가 이미 돼 있는 만큼 성능·부하 테스트로 완성도를 끌어올리려 합니다. 세부 우선순위는 팀과 확정하겠습니다.

